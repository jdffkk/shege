  </style>
</head>

      ],

        { name:"Spammer", desc:"自动发送聊天消息", enabled:false, config:{delay:3000, randomOrder:true} }
      ],
      client: [
        { name:"AccentColor", desc:"主题强调色", enabled:true, config:{color:"#ff66aa"}, isColor:true },
        { name:"Theme", desc:"预设主题", enabled:true, config:{theme:["Pink","Blue","Purple","Green"], themeVal:"Pink"} },
        { name:"BlurAmount", desc:"高斯模糊强度", enabled:true, config:{blur:24} },
        { name:"PanelOpacity", desc:"面板透明度", enabled:true, config:{opacity:92} },
        { name:"GUIScale", desc:"界面缩放", enabled:true, config:{scale:1.0} }
      ]
    };

    const categoryNames = {
      combat: '⚔️ Combat', movement: '🏃 Movement', player: '👤 Player',
      visual: '👁️ Visual', misc: '⚙️ Misc', client: '🖥️ Client'
    };

    const presetColors = [
      { name:"Pink", color:"#ff66aa" },
      { name:"Blue", color:"#00b4ff" },
      { name:"Purple", color:"#b266ff" },
      { name:"Green", color:"#55dd88" },
      { name:"Red", color:"#ff5555" },
      { name:"Orange", color:"#ffaa44" },
      { name:"Cyan", color:"#44dddd" },
      { name:"White", color:"#dddddd" }
    ];

    const themeColors = {
      Pink: { primary:'#ff66aa', glow:'#ff3388', border:'rgba(255,100,180,0.45)' },
      Blue: { primary:'#00b4ff', glow:'#0066ff', border:'rgba(0,180,255,0.45)' },
      Purple: { primary:'#b266ff', glow:'#7700ff', border:'rgba(170,100,255,0.5)' },
      Green: { primary:'#55dd88', glow:'#22aa44', border:'rgba(80,220,120,0.5)' }
    };

    let currentCategory = 'combat';
    let expandedModule = null;
    const mainGui = document.getElementById('mainGui');
    const minimizedBtn = document.getElementById('minimizedBtn');
    const minimizeBtn = document.getElementById('minimizeBtn');
    const closeBtn = document.getElementById('closeBtn');

    const categoryPanel = document.getElementById('categoryPanel');
    const moduleGrid = document.getElementById('moduleGrid');
    const currentCategoryTitle = document.getElementById('currentCategoryTitle');
    const root = document.documentElement;

    function applyAccentColor(color) {
      root.style.setProperty('--primary', color);
      root.style.setProperty('--accent', color);
      root.style.setProperty('--primary-glow', color + 'cc');
      root.style.setProperty('--border', color.replace(')', ',0.45)').replace('rgb', 'rgba'));
    }

    function applyTheme(themeName) {
      const t = themeColors[themeName];
      if (t) {
        root.style.setProperty('--primary', t.primary);
        root.style.setProperty('--primary-glow', t.glow);
        root.style.setProperty('--border', t.border);
        root.style.setProperty('--accent', t.primary);
      }
    }

    function applyBlur(value) {
      root.style.setProperty('--blur-amount', value + 'px');
    }

    function applyOpacity(value) {
      root.style.setProperty('--panel-opacity', value / 100);
    }

    function applyScale(value) {
      root.style.setProperty('--gui-scale', value);
    }

    function minimizeGUI() {
      mainGui.classList.add('gui-hidden');
      minimizedBtn.classList.add('show');
    }
    function restoreGUI() {
      mainGui.classList.remove('gui-hidden');
      minimizedBtn.classList.remove('show');
    }
    function closeGUI() {
      mainGui.classList.add('gui-hidden');
      minimizedBtn.classList.remove('show');
    }

    minimizeBtn.addEventListener('click', minimizeGUI);
    closeBtn.addEventListener('click', closeGUI);
    minimizedBtn.addEventListener('click', restoreGUI);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'VolumeUp' || e.key === 'AudioVolumeUp' || e.keyCode === 175) {
        e.preventDefault();
        restoreGUI();
      }
    });

    function createInlineConfig(module, card) {
      const existing = card.nextElementSibling;
      if (existing && existing.classList.contains('module-config-inline')) {
        existing.remove();
        card.classList.remove('expanded');
        if (expandedModule === module) expandedModule = null;
        return;
      }

      if (expandedModule && expandedModule !== module) {
        const prevCard = document.querySelector('.module-card.expanded');
        if (prevCard) {
          prevCard.classList.remove('expanded');
          const prevConfig = prevCard.nextElementSibling;
          if (prevConfig && prevConfig.classList.contains('module-config-inline')) prevConfig.remove();
        }
      }

      const configDiv = document.createElement('div');
      configDiv.className = 'module-config-inline';
      let html = '';

      if (module.isColor) {
        html += `<div class="config-row"><label>强调色</label><div class="color-options" data-key="color">`;
        presetColors.forEach(pc => {
          html += `<span class="color-dot${module.config.color === pc.color ? ' active' : ''}" data-color="${pc.color}" style="background:${pc.color};" title="${pc.name}"></span>`;
        });
        html += `</div></div>`;
      }

      Object.entries(module.config).forEach(([key, value]) => {
        if (module.isColor && key === 'color') return;
        if (key.endsWith('Val') && module.config[key.replace('Val','')] instanceof Array) {
          const modeKey = key.replace('Val','');
          const options = module.config[modeKey];
          html += `<div class="config-row"><label>${modeKey}</label><div class="mode-selector" data-key="${key}">`;
          options.forEach(opt => {
            html += `<span class="mode-option${value === opt ? ' active' : ''}" data-val="${opt}">${opt}</span>`;
          });
          html += `</div></div>`;
        } else if (typeof value === 'boolean') {
          html += `<div class="config-row"><label>${key}</label><input type="checkbox" ${value?'checked':''} data-key="${key}" data-type="bool"><span>${value}</span></div>`;
        } else if (typeof value === 'number') {
          let max = 100, step = 0.1;
          if (key === 'blur') { max = 50; step = 1; }
          else if (key === 'opacity') { max = 100; step = 1; }
          else if (key === 'scale') { max = 2; step = 0.1; }
          else if (key.includes('cps')) max = 20;
          else if (key.includes('delay')) max = 3000;
          html += `<div class="config-row"><label>${key}</label><input type="range" min="0" max="${max}" step="${step}" value="${value}" data-key="${key}" data-type="number"><span>${value}</span></div>`;
        }
      });

      configDiv.innerHTML = html;
      card.after(configDiv);
      card.classList.add('expanded');
      expandedModule = module;

      configDiv.querySelectorAll('.color-dot').forEach(dot => {
        dot.addEventListener('click', function(e) {
          e.stopPropagation();
          const color = this.getAttribute('data-color');
          module.config.color = color;
          this.parentElement.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
          this.classList.add('active');
          applyAccentColor(color);
        });
      });

      configDiv.querySelectorAll('.mode-option').forEach(opt => {
        opt.addEventListener('click', function(e) {
          e.stopPropagation();
          const key = this.parentElement.getAttribute('data-key');
          const val = this.getAttribute('data-val');
          module.config[key] = val;
          this.parentElement.querySelectorAll('.mode-option').forEach(o => o.classList.remove('active'));
          this.classList.add('active');
          if (module.name === 'Theme') applyTheme(val);
        });
      });

      configDiv.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', function(e) {
          e.stopPropagation();
          const key = this.getAttribute('data-key');
          const type = this.getAttribute('data-type');
          if (type === 'number') {
            const val = parseFloat(this.value);
            module.config[key] = val;
            this.nextElementSibling.textContent = val;
            if (module.name === 'BlurAmount') applyBlur(val);
            if (module.name === 'PanelOpacity') applyOpacity(val);
            if (module.name === 'GUIScale') applyScale(val);
          } else if (type === 'bool') {
            module.config[key] = this.checked;
            this.nextElementSibling.textContent = this.checked;
          }
        });
      });
    }

    function renderCategories() {
      categoryPanel.innerHTML = '';
      Object.keys(modulesData).forEach(cat => {
        const div = document.createElement('div');
        div.className = `category-item ${cat === currentCategory ? 'active' : ''}`;
        div.setAttribute('data-category', cat);
        div.innerHTML = `<i>${categoryNames[cat]?.split(' ')[0]}</i> ${cat}`;
        div.addEventListener('click', () => {
          document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          currentCategory = cat;
          expandedModule = null;
          renderModules(currentCategory);
        });
        categoryPanel.appendChild(div);
      });
    }

    function renderModules(category) {
      const mods = modulesData[category] || [];
      currentCategoryTitle.textContent = categoryNames[category] || category;
      moduleGrid.innerHTML = '';
      expandedModule = null;

      mods.forEach((mod, idx) => {
        const card = document.createElement('div');
        card.className = 'module-card';
        card.innerHTML = `
          <div class="module-info">
            <div class="module-name"><span>🔹 ${mod.name}</span></div>
            <div class="module-desc">${mod.desc}</div>
          </div>
          <div class="toggle-switch">
            <input type="checkbox" id="sw-${category}-${idx}" ${mod.enabled?'checked':''}>
            <label class="slider" for="sw-${category}-${idx}"></label>
          </div>`;
        
        const checkbox = card.querySelector('input[type=checkbox]');
        checkbox.addEventListener('change', (e) => {
          e.stopPropagation();
          mod.enabled = checkbox.checked;
        });
        checkbox.addEventListener('click', (e) => e.stopPropagation());

        card.addEventListener('click', (e) => {
          if (e.target.closest('.toggle-switch')) return;
          createInlineConfig(mod, card);
        });

        card.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          createInlineConfig(mod, card);
        });

        moduleGrid.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderModules('combat');
    });
  })();
</script>
</body>
</html>
