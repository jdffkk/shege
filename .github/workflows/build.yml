name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Myau-Mod
          path: build/libs/*.jar
